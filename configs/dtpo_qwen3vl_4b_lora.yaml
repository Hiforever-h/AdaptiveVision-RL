data:
  train_files: data/verl_agent/train.parquet
  val_files: data/verl_agent/val.parquet
  train_batch_size: 4
  val_batch_size: 64
  max_prompt_length: 6144
  max_response_length: 512
  filter_overlong_prompts: false
  truncation: error
  return_raw_chat: true
  image_key: images
  apply_chat_template_kwargs:
    enable_thinking: false

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-VL-4B-Instruct
    external_lib: adaptive_vision_rl.verl_agent_hooks
    lora_rank: 64
    lora_alpha: 128
    # Keep adapters in the language stack; this is also the subset vLLM can
    # hot-load reliably for rollout. The frozen vision encoder still supplies
    # gradients to these language-side projections through multimodal tokens.
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    enable_gradient_checkpointing: true
    use_remove_padding: true
  actor:
    optim:
      lr: 1.0e-6
      weight_decay: 0.01
      lr_warmup_steps_ratio: 0.03
    # 4 prompts x 8 rollouts x at most 2 turns = 64 step rows. Direct-only
    # batches are padded to 64 with zero-loss rows so both DTPO denominators
    # are computed over the complete rollout batch, not separate PPO chunks.
    ppo_mini_batch_size: 64
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.24
    entropy_coeff: 0.0
    use_invalid_action_penalty: false
    use_kl_loss: false
    loss_agg_mode: token-mean
    use_torch_compile: true
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: vllm
    mode: sync
    n: 1
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 1
    gpu_memory_utilization: 0.42
    enable_chunked_prefill: false
    enforce_eager: true
    free_cache_engine: false
    max_num_batched_tokens: 8192
    limit_images: 2
    val_kwargs:
      temperature: 0.0
      do_sample: false
      n: 1
    multi_turn:
      enable: false

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: true
  filter_groups:
    enable: false
  dtpo:
    tool_advantage_coef: 0.3
    balance_penalty: 0.01
    balance_threshold: 0.2
    coverage_weight: 0.5
    advantage_epsilon: 1.0e-6

reward_model:
  enable: false
  reward_manager: episode
  launch_reward_fn_async: false

env:
  env_name: adaptive_vision
  seed: 20260922
  max_steps: 2
  history_length: 0
  rollout:
    n: 8
  adaptive_vision:
    data_root: data/visionthink_3000_300_500_balanced

trainer:
  n_gpus_per_node: 1
  nnodes: 1
  total_epochs: 1
  total_training_steps: null
  balance_batch: true
  # verl-agent initializes both backends in the driver process. tqdm displays
  # elapsed/remaining time locally; ETA metrics are also sent to WandB.
  logger: [console, wandb]
  project_name: adaptive_vision_rl
  experiment_name: qwen3vl_4b_dtpo_lora
  val_before_train: true
  test_freq: 50
  save_freq: 250
  max_actor_ckpt_to_keep: 1
  default_local_dir: checkpoints/adaptive_vision_rl/qwen3vl_4b_dtpo_lora
  rollout_data_dir: outputs/rollouts/qwen3vl_4b_dtpo_lora
  resume_mode: auto

ray_init:
  num_cpus: 16
